<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xマッチ上達ノート</title>
<style>
:root{
  --bg:#12121a;--card:#1c1c28;--card2:#252535;--text:#f0f0f6;--sub:#9a9ab0;
  --line:#33334a;--a:#c8ff2e;--b:#ff4fa3;--w:#3ddc97;--l:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5;padding-bottom:80px}
header{padding:16px 16px 4px}
h1{font-size:19px;margin:0}
h1 span{color:var(--a)}
.sub{color:var(--sub);font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d0d14;border-top:1px solid var(--line);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:10px 0 12px;font-size:12px;font-family:inherit}
nav button b{display:block;font-size:18px;font-weight:400}
nav button.on{color:var(--a)}
main{padding:12px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--a);letter-spacing:.03em}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-family:inherit}
.seg button.on{background:var(--a);color:#111;border-color:var(--a);font-weight:700}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.btn{background:var(--a);color:#111;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px;width:100%;margin-top:12px;font-family:inherit}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.sm{width:auto;padding:6px 12px;font-size:12px;margin:0;border-radius:8px}
.wl{display:flex;gap:10px;margin-top:12px}
.wl button{flex:1;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--text);font-size:18px;font-weight:800;font-family:inherit}
.wl button.W.on{background:var(--w);color:#062;border-color:var(--w)}
.wl button.L.on{background:var(--l);color:#400;border-color:var(--l)}
.m{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.m:first-child{border-top:0}
.badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.badge.W{background:var(--w);color:#052}
.badge.L{background:var(--l);color:#400}
.m .t{flex:1;min-width:0}
.m .t div:first-child{font-size:14px}
.m .t div+div{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:none;border:0;color:var(--sub);font-size:18px;padding:4px 8px}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--a)}
.bar i.low{background:var(--l)}
.stat{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.stat .n{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .v{width:76px;text-align:right;color:var(--sub);font-size:12px}
.big{display:flex;gap:8px;text-align:center}
.big div{flex:1;background:var(--card2);border-radius:12px;padding:10px 4px}
.big b{display:block;font-size:22px}
.big span{font-size:11px;color:var(--sub)}
.tip{background:#2a2a1a;border:1px solid #5a5a22;border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
.note{border-top:1px solid var(--line);padding:10px 0}
.note:first-child{border-top:0}
.note h3{margin:0;font-size:14px}
.note p{margin:4px 0 0;white-space:pre-wrap;font-size:13px;color:#d0d0e0}
.tag{display:inline-block;font-size:11px;background:var(--card2);border-radius:6px;padding:1px 7px;color:var(--sub);margin-right:4px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--a)}
.chk.done span{text-decoration:line-through;color:var(--sub)}
.chk span{flex:1}
.days{display:flex;gap:4px;margin-top:6px}
.days div{flex:1;text-align:center;font-size:10px;color:var(--sub)}
.days i{display:block;height:26px;border-radius:6px;background:var(--card2);margin-bottom:2px}
.days i.f{background:var(--a)}
.days i.p{background:#6b8a1d}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Xマッチ<span>上達ノート</span></h1>
  <div class="sub">記録 → 振り返り → 対策 → 練習 を回すためのノート</div>
</header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
(function(){
"use strict";

const RULES=["エリア","ヤグラ","ホコ","アサリ"];
const STAGES=["ユノハナ大渓谷","ゴンズイ地区","ヤガラ市場","マテガイ放水路","ナメロウ金属","マサバ海峡大橋","キンメダイ美術館","マヒマヒリゾート&スパ","海女美術大学","チョウザメ造船","ザトウマーケット","スメーシーワールド","クサヤ温泉","ヒラメが丘団地","ナンプラー遺跡","ナメロウ金属","タラポートショッピングパーク","コンブトラック","タカアシ経済特区","オヒョウ海運","バイガイ亭","ネギトロ炭鉱","カジキ空港","リュウグウターミナル","デカライン高架下"].filter((v,i,a)=>a.indexOf(v)===i);
const TAGS=["前に出すぎた","引きすぎた","位置取りミス","打開で無理した","復帰が遅い","エイムのブレ","塗り・インク管理","1人で突っ込んだ","ヘイト管理","スペシャルの使い所","カウント意識不足","ブキ相性が悪い"];
const CATS=["ステージ","ブキ","ルール","メンタル・その他"];
const DEFAULT_ROUTINE=[
  "ヒト速（ヒト状態）でのエイム練習 5分",
  "試し撃ちで対面・偏差撃ちを数回",
  "今日の意識テーマを1つ決める",
  "1戦だけ負け試合をリプレイで確認",
  "ステージの高台・退路を1つ確認"
];
const KEY="splat_coach_v1";

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function fresh(){return {matches:[],notes:[],routine:DEFAULT_ROUTINE.map(t=>({id:uid(),text:t})),log:{},theme:{},draft:{rule:"エリア",result:null,tags:[]}}}
let S=fresh();
let storageOK=true;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw);S=Object.assign(fresh(),o);}
  }catch(e){storageOK=false}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}
}
load();

let tab="rec";
let ui={noteQ:"",editNote:null,showIO:false,ioMsg:"",anaRule:"all",detail:null};

function allNames(kind){
  const base=kind==="stage"?STAGES:[];
  const used=S.matches.map(m=>m[kind]).filter(Boolean);
  return base.concat(used).filter((v,i,a)=>a.indexOf(v)===i);
}

/* ---------- スケジュール ---------- */
const SCHED_URL="https://spla3.yuu26.com/api/x/schedule";
const SCHED_LINK="https://splatoon3.ink/";
let sched={state:"idle",list:[],at:0};
function ruleShort(name){
  name=String(name||"");
  if(name.includes("エリア"))return "エリア";
  if(name.includes("ヤグラ"))return "ヤグラ";
  if(name.includes("ホコ"))return "ホコ";
  if(name.includes("アサリ"))return "アサリ";
  return name;
}
function loadSchedule(force){
  if(sched.state==="loading")return;
  if(!force&&sched.state==="ok"&&Date.now()-sched.at<5*60*1000)return;
  sched.state="loading";
  fetch(SCHED_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
    const now=Date.now();
    sched.list=(j.results||[]).filter(x=>new Date(x.end_time).getTime()>now).slice(0,4).map(x=>({
      start:new Date(x.start_time),end:new Date(x.end_time),
      rule:ruleShort(x.rule&&x.rule.name),
      stages:(x.stages||[]).map(s=>s.name),fest:!!x.is_fest
    }));
    sched.state="ok";sched.at=now;
  }).catch(()=>{sched.state="err"}).then(()=>{if(tab==="rec"){readDraft();render()}});
}
function hm(d){return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
function stageRate(stage,rule){
  const l=S.matches.filter(m=>m.stage===stage&&m.rule===rule);
  if(!l.length)return "記録なし";
  const w=l.filter(m=>m.result==="W").length;
  return `${Math.round(w/l.length*100)}% (${w}-${l.length-w})`;
}
function viewSchedule(){
  let body;
  if(sched.state==="ok"&&sched.list.length){
    body=sched.list.map((s,i)=>`
      <div style="padding:8px 0;${i?"border-top:1px solid var(--line)":""}">
        <div style="font-size:12px;color:var(--sub)">${i===0?"<b style='color:var(--a)'>いま</b> ":""}${hm(s.start)}〜${hm(s.end)}　<b style="color:var(--text)">${esc(s.rule)}</b>${s.fest?"（フェス中）":""}</div>
        ${s.stages.map(st=>{const hasNote=S.notes.some(n=>n.title.includes(st));return `<div style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <div style="flex:1;font-size:14px">${esc(st)}${hasNote?" 📝":""}</div>
          <div style="font-size:11px;color:var(--sub)">${stageRate(st,s.rule)}</div>
          ${i===0?`<button class="btn sm sec" data-a="pickStage" data-v="${esc(s.rule)}|${esc(st)}">選ぶ</button>`:""}
        </div>`}).join("")}
      </div>`).join("");
  }else if(sched.state==="err"||(sched.state==="ok"&&!sched.list.length)){
    body=`<div class="sub">スケジュールを取得できませんでした。<a href="${SCHED_LINK}" target="_blank" rel="noopener" style="color:var(--a)">スケジュールサイトで確認</a></div>`;
  }else{
    body=`<div class="sub">読み込み中…</div>`;
  }
  return `<div class="card"><div style="display:flex;align-items:center"><h2 style="flex:1;margin:0 0 6px">Xマッチ スケジュール</h2><button class="x" data-a="reloadSched" aria-label="再読み込み">↻</button></div>${body}</div>`;
}

/* ---------- 記録 ---------- */
function viewRec(){
  const d=S.draft;
  const last=S.matches[0];
  const stageNotes=d.stage?S.notes.filter(n=>n.title.includes(d.stage)||(n.body&&n.body.includes(d.stage))):[];
  const wpnNotes=d.weapon?S.notes.filter(n=>n.title.includes(d.weapon)):[];
  const rel=stageNotes.concat(wpnNotes).filter((n,i,a)=>a.indexOf(n)===i);
  return viewSchedule()+`
  <div class="card">
    <h2>対戦を記録</h2>
    <label>ルール</label>
    <div class="seg">${RULES.map(r=>`<button data-a="rule" data-v="${r}" class="${d.rule===r?"on":""}">${r}</button>`).join("")}</div>
    <div class="row">
      <div><label>ステージ</label><input id="f-stage" list="dl-stage" value="${esc(d.stage||"")}" placeholder="選択 or 入力"></div>
      <div><label>ブキ</label><input id="f-weapon" list="dl-weapon" value="${esc(d.weapon||last&&last.weapon||"")}" placeholder="ブキ名"></div>
    </div>
    <datalist id="dl-stage">${allNames("stage").map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
    <datalist id="dl-weapon">${allNames("weapon").map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
    ${rel.length?`<div class="tip">📝 関連メモ：${rel.map(n=>`<b>${esc(n.title)}</b>`).join("、")}<br>${esc(rel[0].body.slice(0,80))}${rel[0].body.length>80?"…":""}</div>`:""}
    <div class="wl">
      <button class="W ${d.result==="W"?"on":""}" data-a="res" data-v="W">WIN</button>
      <button class="L ${d.result==="L"?"on":""}" data-a="res" data-v="L">LOSE</button>
    </div>
    <div class="row">
      <div><label>Xパワー（任意）</label><input id="f-power" type="number" inputmode="decimal" step="0.1" value="${esc(d.power||"")}" placeholder="例 2100"></div>
      <div><label>K / D（任意）</label><div class="row"><input id="f-k" type="number" inputmode="numeric" placeholder="K" value="${esc(d.k||"")}"><input id="f-d" type="number" inputmode="numeric" placeholder="D" value="${esc(d.d||"")}"></div></div>
    </div>
    <label>${d.result==="W"?"うまくいった点":"反省ポイント（複数選択）"}</label>
    <div class="seg">${TAGS.map(t=>`<button class="chip ${d.tags.includes(t)?"on":""}" data-a="tag" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <label>ひとことメモ</label>
    <textarea id="f-memo" placeholder="次に活かすこと">${esc(d.memo||"")}</textarea>
    <button class="btn" data-a="saveMatch">記録する</button>
  </div>
  <div class="card">
    <h2>最近の対戦</h2>
    ${S.matches.length?S.matches.slice(0,12).map(m=>`
      <div class="m">
        <div class="badge ${m.result}">${m.result==="W"?"W":"L"}</div>
        <div class="t"><div>${esc(m.rule)} / ${esc(m.stage||"ステージ未入力")}</div>
        <div>${esc(m.weapon||"-")}${m.power?" ・X "+esc(m.power):""}${(m.k!==""&&m.k!=null)?" ・"+esc(m.k)+"K"+esc(m.d)+"D":""}${m.tags&&m.tags.length?" ・"+m.tags.map(esc).join("/"):""}</div></div>
        <button class="x" data-a="delMatch" data-v="${m.id}" aria-label="削除">×</button>
      </div>`).join(""):`<div class="empty">まだ記録がありません</div>`}
  </div>`;
}

function readDraft(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:""};
  if(!document.getElementById("f-stage"))return;
  S.draft.stage=g("f-stage").trim();
  S.draft.weapon=g("f-weapon").trim();
  S.draft.power=g("f-power");
  S.draft.k=g("f-k");S.draft.d=g("f-d");
  S.draft.memo=g("f-memo");
}

/* ---------- 分析 ---------- */
function groupStats(list,key){
  const g={};
  list.forEach(m=>{const k=m[key]||"(未入力)";g[k]=g[k]||{w:0,n:0};g[k].n++;if(m.result==="W")g[k].w++});
  return Object.entries(g).map(([k,v])=>({k,w:v.w,n:v.n,r:v.w/v.n})).sort((a,b)=>b.n-a.n);
}
function statRows(rows){
  return rows.map(r=>`<div class="stat"><div class="n">${esc(r.k)}</div><div class="bar"><i class="${r.r<0.5?"low":""}" style="width:${Math.round(r.r*100)}%"></i></div><div class="v">${Math.round(r.r*100)}% (${r.w}-${r.n-r.w})</div></div>`).join("");
}
function powerChart(list){
  const pts=list.filter(m=>m.power!==""&&m.power!=null&&!isNaN(parseFloat(m.power))).slice(0,30).reverse().map(m=>parseFloat(m.power));
  if(pts.length<2)return `<div class="empty">Xパワーを2戦以上記録すると推移が出ます</div>`;
  const W=320,H=120,p=8;
  const mn=Math.min(...pts),mx=Math.max(...pts),span=(mx-mn)||1;
  const xy=pts.map((v,i)=>[p+i*(W-2*p)/(pts.length-1),H-p-(v-mn)/span*(H-2*p)]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Xパワー推移">
    <polyline fill="none" stroke="var(--a)" stroke-width="2.5" stroke-linejoin="round" points="${xy.map(a=>a.join(",")).join(" ")}"/>
    ${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="var(--a)"/>`).join("")}
  </svg>
  <div class="sub" style="display:flex;justify-content:space-between"><span>最低 ${mn}</span><span>直近${pts.length}戦</span><span>最高 ${mx}</span></div>`;
}
function viewAna(){
  const all=S.matches;
  if(!all.length)return `<div class="card"><div class="empty">「記録」タブで対戦を入力すると、ここに傾向が出ます</div></div>`;
  const list=ui.anaRule==="all"?all:all.filter(m=>m.rule===ui.anaRule);
  const w=list.filter(m=>m.result==="W").length,n=list.length;
  const last10=list.slice(0,10),w10=last10.filter(m=>m.result==="W").length;
  let streak=0;if(list.length){const f=list[0].result;for(const m of list){if(m.result===f)streak++;else break}streak=(f==="W"?"+":"-")+streak}
  const stg=groupStats(list,"stage"),wpn=groupStats(list,"weapon");
  const losses=list.filter(m=>m.result==="L");
  const tc={};losses.forEach(m=>(m.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  const tagRows=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const insights=[];
  const badStage=stg.filter(r=>r.n>=3&&r.r<0.4)[0];
  if(badStage)insights.push(`「${badStage.k}」は${badStage.n}戦で勝率${Math.round(badStage.r*100)}%。対策メモを作る価値あり。`);
  const goodStage=stg.filter(r=>r.n>=3&&r.r>=0.65)[0];
  if(goodStage)insights.push(`「${goodStage.k}」は得意（勝率${Math.round(goodStage.r*100)}%）。なぜ勝てるかをメモしておくと他に応用できます。`);
  if(tagRows.length)insights.push(`負け試合で最も多い反省は「${tagRows[0][0]}」（${tagRows[0][1]}回）。練習テーマに入れてみましょう。`);
  if(n>=10&&w10<=3)insights.push(`直近10戦で${w10}勝。連敗が続くなら一度休憩を。`);
  return `
  <div class="card">
    <div class="seg">${["all"].concat(RULES).map(r=>`<button data-a="anaRule" data-v="${r}" class="${ui.anaRule===r?"on":""}">${r==="all"?"全ルール":r}</button>`).join("")}</div>
    ${n?`<div class="big" style="margin-top:12px">
      <div><b>${Math.round(w/n*100)}%</b><span>勝率（${n}戦）</span></div>
      <div><b>${w10}-${last10.length-w10}</b><span>直近10戦</span></div>
      <div><b>${streak}</b><span>連続</span></div>
    </div>`:`<div class="empty">このルールの記録はまだありません</div>`}
    ${insights.map(t=>`<div class="tip">💡 ${esc(t)}</div>`).join("")}
  </div>
  <div class="card"><h2>Xパワー推移</h2>${powerChart(list)}</div>
  <div class="card"><h2>ステージ別</h2>${statRows(stg.slice(0,10))}</div>
  <div class="card"><h2>ブキ別</h2>${statRows(wpn.slice(0,8))}</div>
  <div class="card"><h2>負けの反省タグ</h2>${tagRows.length?tagRows.map(([t,c])=>`<div class="stat"><div class="n" style="width:60%">${esc(t)}</div><div class="bar"><i class="low" style="width:${Math.round(c/tagRows[0][1]*100)}%"></i></div><div class="v">${c}回</div></div>`).join(""):`<div class="empty">負けた試合に反省タグを付けると集計されます</div>`}</div>`;
}

/* ---------- 対策メモ ---------- */
function viewNotes(){
  const q=ui.noteQ.trim().toLowerCase();
  const list=S.notes.filter(n=>!q||(n.title+n.body+n.cat).toLowerCase().includes(q));
  const e=ui.editNote;
  const form=e?`
  <div class="card">
    <h2>${e.id?"メモを編集":"メモを追加"}</h2>
    <label>種類</label>
    <div class="seg">${CATS.map(c=>`<button data-a="noteCat" data-v="${c}" class="${e.cat===c?"on":""}">${c}</button>`).join("")}</div>
    <label>タイトル（ステージ名・ブキ名など）</label>
    <input id="n-title" list="dl-stage" value="${esc(e.title)}" placeholder="例：ユノハナ大渓谷 ホコ">
    <label>内容</label>
    <textarea id="n-body" style="min-height:120px" placeholder="高台、退路、相手の嫌がる位置、自分の勝ち筋など">${esc(e.body)}</textarea>
    <datalist id="dl-stage">${allNames("stage").map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
    <div class="row"><button class="btn sec" data-a="noteCancel">キャンセル</button><button class="btn" data-a="noteSave">保存</button></div>
  </div>`:`<button class="btn" data-a="noteNew" style="margin-top:0;margin-bottom:12px">＋ 新しい対策メモ</button>`;
  return form+`
  <div class="card">
    <input id="n-q" placeholder="メモを検索" value="${esc(ui.noteQ)}" style="margin-bottom:8px">
    ${list.length?list.map(n=>`
      <div class="note">
        <div style="display:flex;gap:6px;align-items:center"><h3 style="flex:1">${esc(n.title)}</h3><span class="tag">${esc(n.cat)}</span>
        <button class="x" data-a="noteEdit" data-v="${n.id}" aria-label="編集">✎</button><button class="x" data-a="noteDel" data-v="${n.id}" aria-label="削除">×</button></div>
        <p>${esc(n.body)}</p>
      </div>`).join(""):`<div class="empty">${S.notes.length?"該当なし":"メモはまだありません。負けやすいステージから書いてみましょう"}</div>`}
  </div>`;
}

/* ---------- 練習 ---------- */
function viewPractice(){
  const t=today();
  const done=S.log[t]||[];
  const total=S.routine.length;
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=today(d);const c=(S.log[k]||[]).filter(id=>S.routine.some(r=>r.id===id)).length;days.push({k,c,lab:["日","月","火","水","木","金","土"][d.getDay()]})}
  let streak=0;
  for(let i=0;i<365;i++){const d=new Date();d.setDate(d.getDate()-i);const k=today(d);if((S.log[k]||[]).length>0)streak++;else if(i===0)continue;else break}
  return `
  <div class="card">
    <h2>今日のテーマ</h2>
    <input id="p-theme" value="${esc(S.theme[t]||"")}" placeholder="例：前に出すぎない／復帰ルートを意識">
    <div class="sub" style="margin-top:6px">負けの反省で多いのは「${esc(topTag()||"（記録が増えると表示）")}」</div>
  </div>
  <div class="card">
    <h2>練習メニュー　${done.filter(id=>S.routine.some(r=>r.id===id)).length}/${total}</h2>
    ${S.routine.length?S.routine.map(r=>{const c=done.includes(r.id);return `<div class="chk ${c?"done":""}"><input type="checkbox" data-a="chk" data-v="${r.id}" ${c?"checked":""}><span>${esc(r.text)}</span><button class="x" data-a="delRoutine" data-v="${r.id}" aria-label="削除">×</button></div>`}).join(""):`<div class="empty">メニューがありません</div>`}
    <div class="row" style="margin-top:10px"><input id="p-new" placeholder="メニューを追加"><button class="btn sm" data-a="addRoutine" style="flex:none;width:72px">追加</button></div>
  </div>
  <div class="card">
    <h2>この7日間　連続 ${streak}日</h2>
    <div class="days">${days.map(d=>`<div><i class="${d.c>=total&&total?"f":d.c>0?"p":""}"></i>${d.lab}</div>`).join("")}</div>
  </div>
  <div class="card">
    <h2>バックアップ</h2>
    <div class="sub">データはこのブラウザ内にだけ保存されます。${storageOK?"":"<b style='color:var(--l)'>※現在は保存できない環境です。</b>"}機種変更やキャッシュ削除に備えて、定期的に書き出しておくと安心です。</div>
    <div class="row" style="margin-top:8px"><button class="btn sec sm" data-a="io" style="padding:10px">書き出し／読み込み</button></div>
    ${ui.showIO?`<textarea id="io-text" style="min-height:120px;margin-top:8px;font-size:12px" placeholder="読み込む場合はここに書き出したテキストを貼り付け">${esc(ui.ioText||"")}</textarea>
    <div class="row"><button class="btn sec" data-a="copyIO">コピー</button><button class="btn" data-a="importIO">読み込む</button></div>
    ${ui.ioMsg?`<div class="sub" style="margin-top:6px">${esc(ui.ioMsg)}</div>`:""}`:""}
  </div>`;
}
function topTag(){
  const tc={};S.matches.filter(m=>m.result==="L").forEach(m=>(m.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  const e=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:"";
}

/* ---------- render ---------- */
const TABS=[["rec","✏️","記録"],["ana","📊","分析"],["notes","📝","対策"],["prac","🎯","練習"]];
function render(){
  document.getElementById("nav").innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab===t[0]?"on":""}"><b>${t[1]}</b>${t[2]}</button>`).join("");
  const app=document.getElementById("app");
  app.innerHTML=tab==="rec"?viewRec():tab==="ana"?viewAna():tab==="notes"?viewNotes():viewPractice();
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(a==="chk")return;
  if(a==="tab"){readDraft();tab=v;window.scrollTo(0,0);render();return}
  if(tab==="rec")readDraft();
  if(a==="rule"){S.draft.rule=v}
  else if(a==="res"){S.draft.result=v}
  else if(a==="tag"){const i=S.draft.tags.indexOf(v);if(i>=0)S.draft.tags.splice(i,1);else S.draft.tags.push(v)}
  else if(a==="saveMatch"){
    if(!S.draft.result){flash("WIN / LOSE を選んでください");return}
    const d=S.draft;
    S.matches.unshift({id:uid(),ts:Date.now(),rule:d.rule,stage:d.stage||"",weapon:d.weapon||"",result:d.result,power:d.power||"",k:d.k||"",d:d.d||"",tags:d.tags.slice(),memo:d.memo||""});
    S.draft={rule:d.rule,weapon:d.weapon,result:null,tags:[]};
    flash("記録しました");
  }
  else if(a==="pickStage"){const p=v.split("|");if(RULES.includes(p[0]))S.draft.rule=p[0];S.draft.stage=p[1];flash(p[1]+" を選びました")}
  else if(a==="reloadSched"){loadSchedule(true)}
  else if(a==="delMatch"){S.matches=S.matches.filter(m=>m.id!==v)}
  else if(a==="anaRule"){ui.anaRule=v}
  else if(a==="noteNew"){ui.editNote={id:null,cat:"ステージ",title:"",body:""}}
  else if(a==="noteCat"){readNote();ui.editNote.cat=v}
  else if(a==="noteCancel"){ui.editNote=null}
  else if(a==="noteEdit"){const n=S.notes.find(n=>n.id===v);ui.editNote=Object.assign({},n);window.scrollTo(0,0)}
  else if(a==="noteDel"){S.notes=S.notes.filter(n=>n.id!==v)}
  else if(a==="noteSave"){
    readNote();const e=ui.editNote;
    if(!e.title.trim()){flash("タイトルを入力してください");return}
    if(e.id){const i=S.notes.findIndex(n=>n.id===e.id);S.notes[i]={id:e.id,cat:e.cat,title:e.title.trim(),body:e.body}}
    else S.notes.unshift({id:uid(),cat:e.cat,title:e.title.trim(),body:e.body});
    ui.editNote=null;
  }
  else if(a==="addRoutine"){const i=document.getElementById("p-new");if(i.value.trim()){S.routine.push({id:uid(),text:i.value.trim()})}}
  else if(a==="delRoutine"){S.routine=S.routine.filter(r=>r.id!==v)}
  else if(a==="io"){ui.showIO=!ui.showIO;ui.ioText=JSON.stringify(S);ui.ioMsg=""}
  else if(a==="copyIO"){
    const t=document.getElementById("io-text");
    try{navigator.clipboard.writeText(t.value).then(()=>{ui.ioMsg="コピーしました";render()},()=>{t.select();ui.ioMsg="選択しました。手動でコピーしてください";render()})}catch(e){t.select();ui.ioMsg="選択しました。手動でコピーしてください";render()}
    return;
  }
  else if(a==="importIO"){
    try{
      const o=JSON.parse(document.getElementById("io-text").value);
      if(!o||!Array.isArray(o.matches))throw 0;
      S=Object.assign(fresh(),o);ui.ioMsg="読み込みました";ui.ioText=JSON.stringify(S);
    }catch(e){ui.ioMsg="読み込めませんでした。書き出したテキストをそのまま貼ってください";}
  }
  save();render();
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.a==="chk"){
    const t=today();const arr=S.log[t]||(S.log[t]=[]);
    const i=arr.indexOf(el.dataset.v);
    if(el.checked&&i<0)arr.push(el.dataset.v);else if(!el.checked&&i>=0)arr.splice(i,1);
    save();render();return;
  }
  if(el.id==="p-theme"){S.theme[today()]=el.value;save()}
  if(el.id==="f-stage"||el.id==="f-weapon"){readDraft();save();render()}
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="n-q"){ui.noteQ=el.value;const pos=el.selectionStart;render();const n=document.getElementById("n-q");n.focus();n.setSelectionRange(pos,pos)}
});
function readNote(){
  const t=document.getElementById("n-title"),b=document.getElementById("n-body");
  if(t&&ui.editNote){ui.editNote.title=t.value;ui.editNote.body=b.value}
}
let ft;
function flash(msg){
  let e=document.getElementById("toast");
  if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:9";document.body.appendChild(e)}
  e.textContent=msg;e.style.display="block";clearTimeout(ft);ft=setTimeout(()=>e.style.display="none",1800);
}
render();
loadSchedule();
setInterval(()=>{if(tab==="rec")loadSchedule()},60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadSchedule()});
})();
</script>
</body>
</html>
