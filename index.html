<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オハコ帳</title>
<meta name="theme-color" content="#D6246E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="オハコ帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">オハコ帳</span>
    <span class="mode-badge" id="modeBadge" hidden>お試しモード</span>
  </div>
  <button class="user-chip" id="userChip" type="button" hidden></button>
</header>

<main id="main">

  <!-- ログイン画面(Firebaseモードで未ログインのとき) -->
  <section class="view" id="view-login" hidden>
    <div class="login-card">
      <p class="login-lead">自分だけの<br>カラオケ記録帳</p>
      <button class="btn btn-primary btn-lg" id="loginBtn" type="button">Googleでログイン</button>
      <p class="hint" id="loginError" hidden></p>
    </div>
  </section>

  <!-- 曲リスト -->
  <section class="view" id="view-songs" hidden>
    <div class="toolbar">
      <label class="search">
        <span class="visually-hidden">曲名・歌手名で検索</span>
        <input type="search" id="searchInput" placeholder="曲名・歌手名で検索" autocomplete="off">
      </label>
      <div class="toolbar-row">
        <select id="sortSelect" aria-label="並べ替え">
          <option value="new">追加が新しい順</option>
          <option value="title">曲名順</option>
          <option value="artist">歌手名順</option>
          <option value="best">自己ベスト順</option>
          <option value="count">歌った回数順</option>
        </select>
      </div>
      <p class="range-note" id="rangeNote"></p>
    </div>
    <ul class="song-list" id="songList"></ul>
    <div class="empty" id="songsEmpty" hidden></div>
    <button class="fab" id="addSongBtn" type="button" aria-label="曲を追加">＋ 曲を追加</button>
  </section>

  <!-- 十八番 -->
  <section class="view" id="view-favs" hidden>
    <h1 class="view-title">十八番</h1>
    <ul class="song-list" id="favList"></ul>
    <div class="empty" id="favsEmpty" hidden>
      <p>まだ十八番がありません。</p>
      <p class="hint">曲の詳細画面で「十八番にする」を押すと、ここに並びます。</p>
    </div>
  </section>


  <!-- 設定 -->
  <section class="view" id="view-settings" hidden>
    <h1 class="view-title">設定</h1>
    <div class="settings">
      <div class="info-block">
        <h2>接続状態</h2>
        <p id="modeInfo"></p>
        <p id="ytInfo"></p>
      </div>
      <button class="btn" id="logoutBtn" type="button" hidden>ログアウト</button>
      <button class="btn btn-danger" id="clearLocalBtn" type="button" hidden>お試しデータをすべて消す</button>
    </div>
  </section>
</main>

<nav class="tabbar" id="tabbar" hidden>
  <button type="button" data-view="songs" class="tab is-active"><span class="tab-ico">♪</span>曲リスト</button>
  <button type="button" data-view="favs" class="tab"><span class="tab-ico">★</span>十八番</button>
  <button type="button" data-view="settings" class="tab"><span class="tab-ico">≡</span>設定</button>
</nav>

<!-- 曲の詳細 -->
<dialog class="sheet" id="detailDialog" aria-labelledby="detailTitle">
  <div class="sheet-head">
    <button class="icon-btn" type="button" data-close aria-label="閉じる">✕</button>
  </div>
  <div class="sheet-body" id="detailBody"></div>
</dialog>

<!-- 曲の追加・編集 -->
<dialog class="sheet" id="formDialog" aria-labelledby="formTitle">
  <div class="sheet-head">
    <h2 id="formTitle">曲を追加</h2>
    <button class="icon-btn" type="button" data-close aria-label="閉じる">✕</button>
  </div>
  <form class="sheet-body song-form" id="songForm" novalidate>
    <div class="form-yt" id="formYt" hidden>
      <label for="fYtQuery" class="form-yt-label">YouTubeで探して追加</label>
      <div class="yt-search">
        <input type="search" id="fYtQuery" placeholder="曲名や歌手名" enterkeyhint="search" autocomplete="off">
        <button class="btn btn-sm btn-primary" type="button" id="fYtBtn">検索</button>
      </div>
      <p class="hint" id="fYtStatus" hidden></p>
      <ul class="yt-results" id="fYtResults"></ul>
      <p class="form-divider"><span>曲名・歌手名を確認・手入力</span></p>
    </div>
    <div class="field">
      <label for="fTitle">曲名 <span class="req">必須</span></label>
      <input type="text" id="fTitle" required maxlength="100">
    </div>
    <div class="field">
      <label for="fArtist">歌手名</label>
      <input type="text" id="fArtist" maxlength="100">
    </div>
    <div class="field">
      <label for="fVideo">公式動画のURL(任意)</label>
      <input type="url" id="fVideo" placeholder="https://www.youtube.com/watch?v=…" inputmode="url">
    </div>
    <p class="form-error" id="formError" hidden></p>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit" id="formSubmit">追加する</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Firebase(compat版。設定が空なら使いません) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="notes.js"></script>
<script src="app.js"></script>
</body>
</html>
